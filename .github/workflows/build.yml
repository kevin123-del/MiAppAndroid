name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Unzip project
        run: unzip MiAppAndroid.zip -d .
      - name: Fix Gradle files
        run: |
          # Esto arregla el build.gradle para que use versiones modernas
          cd MiAppAndroid
          sed -i 's/compileSdkVersion 33/compileSdk 34/' app/build.gradle
          sed -i 's/targetSdkVersion 33/targetSdk 34/' app/build.gradle
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/' app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/" app/build.gradle
      - name: Build APK
        run: |
          cd MiAppAndroid
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: MiAppAndroid/app/build/outputs/apk/debug/app-debug.apk
