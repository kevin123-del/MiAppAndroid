
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Crear estructura
        run: |
          mkdir -p app/src/main/java/com/tuusuario/miapp
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

      - name: Crear gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Crear configuración Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BotInDrive"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tuusuario.miapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tuusuario.miapp'
                  minSdk 26
                  targetSdk 34
                  versionCode 3
                  versionName '3.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

      - name: Crear Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Bot InDrive"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".InDriveAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="Lector InDrive">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          EOF

      - name: Crear tema
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#6C63FF</item>
                  <item name="android:statusBarColor">#171A2B</item>
                  <item name="android:navigationBarColor">#171A2B</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

      - name: Configurar accesibilidad
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="false"
              android:notificationTimeout="250"
              android:packageNames="sinet.startup.inDriver"/>
          EOF

      - name: Crear motor de decisiones
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/DecisionEngine.kt <<'EOF'
          package com.tuusuario.miapp

          import kotlin.math.ceil

          data class Solicitud(
              val precio: Int,
              val recogida: Double,
              val viaje: Double
          )

          data class Decision(
              val accion: String,
              val monto: Int,
              val motivo: String
          )

          object DecisionEngine {
              fun decidir(s: Solicitud, maxRecogida: Double): Decision {
                  if (s.precio <= 0 || s.recogida < 0 || s.viaje <= 0) {
                      return Decision("SIN DATOS", 0, "Datos inválidos")
                  }

                  if (s.recogida > maxRecogida) {
                      return Decision("DESCARTAR", 0, "Recogida superior al límite")
                  }

                  if (s.recogida <= 2.0 && s.viaje <= 2.0 &&
                      s.precio >= 4000) {
                      return Decision("ACEPTAR", s.precio, "Excepción de tarifa mínima")
                  }

                  val calculo = maxOf(s.viaje * 1200.0, 4800.0)
                  val objetivo = (ceil(calculo / 100.0) * 100).toInt()

                  return if (s.precio >= objetivo) {
                      Decision("ACEPTAR", s.precio, "Oferta igual o superior al objetivo")
                  } else {
                      Decision("CONTRAOFERTAR", objetivo, "Oferta inferior al objetivo")
                  }
              }
          }
          EOF

      - name: Crear registro
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/RegistrarLog.kt <<'EOF'
          package com.tuusuario.miapp

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object RegistrarLog {
              private const val PREFS = "historial_bot"
              private const val KEY = "entradas"

              fun agregar(context: Context, mensaje: String) {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val hora = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  val anterior = prefs.getString(KEY, "") ?: ""
                  val nuevo = "[$hora] $mensaje\n$anterior"
                  prefs.edit().putString(KEY, nuevo.lines().take(100).joinToString("\n")).apply()
              }

              fun obtener(context: Context): String {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "") ?: ""
              }

              fun limpiar(context: Context) {
                  context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .edit().remove(KEY).apply()
              }
          }
          EOF

      - name: Crear lector de InDrive
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/InDriveAccessibilityService.kt <<'EOF'
          package com.tuusuario.miapp

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class InDriveAccessibilityService : AccessibilityService() {

              companion object {
                  var instancia: InDriveAccessibilityService? = null
              }

              private var activo = false
              private var ultimoContenido = ""
              private var ultimoTiempo = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instancia = this
                  RegistrarLog.agregar(this, "Lector conectado correctamente")
              }

              fun activar(valor: Boolean) {
                  activo = valor
                  RegistrarLog.agregar(
                      this,
                      if (valor) "Lectura activada" else "Lectura pausada"
                  )
              }

              fun estaActivo() = activo

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!activo || event == null) return
                  if (event.packageName?.toString() != "sinet.startup.inDriver") return

                  val ahora = System.currentTimeMillis()
                  if (ahora - ultimoTiempo < 700) return
                  ultimoTiempo = ahora

                  val root = rootInActiveWindow ?: return
                  try {
                      val elementos = mutableListOf<String>()
                      leerNodos(root, elementos)

                      val contenido = elementos.distinct().joinToString("\n")
                      if (contenido.isBlank() || contenido == ultimoContenido) return
                      ultimoContenido = contenido

                      procesarContenido(elementos.distinct())
                  } catch (e: Exception) {
                      RegistrarLog.agregar(this, "Error leyendo pantalla: ${e.message}")
                  } finally {
                      root.recycle()
                  }
              }

              private fun leerNodos(
                  nodo: AccessibilityNodeInfo,
                  salida: MutableList<String>
              ) {
                  val texto = nodo.text?.toString()?.trim()
                  if (!texto.isNullOrBlank()) salida.add(texto)

                  val descripcion = nodo.contentDescription?.toString()?.trim()
                  if (!descripcion.isNullOrBlank()) salida.add(descripcion)

                  for (i in 0 until nodo.childCount) {
                      val hijo = nodo.getChild(i) ?: continue
                      try {
                          leerNodos(hijo, salida)
                      } finally {
                          hijo.recycle()
                      }
                  }
              }

              private fun procesarContenido(elementos: List<String>) {
                  val texto = elementos.joinToString("\n")
                  val precios = extraerPrecios(elementos)
                  val distancias = extraerDistancias(elementos)

                  RegistrarLog.agregar(
                      this,
                      "Pantalla leída: ${elementos.size} textos. " +
                      "Precios: ${precios.joinToString()}. " +
                      "Distancias: ${distancias.joinToString()} km."
                  )

                  // En la lista puede haber varias tarjetas.
                  // No se mezclan sus precios ni sus distancias.
                  if (precios.size != 1 || distancias.size < 2) {
                      RegistrarLog.agregar(
                          this,
                          "No se calcula: la pantalla no permite separar una solicitud con seguridad."
                      )
                      return
                  }

                  val recogida = distancias.first()
                  val viaje = distancias.last()

                  val prefs = getSharedPreferences("ajustes_bot", MODE_PRIVATE)
                  val maxRecogida = prefs.getFloat("max_recogida", 3f).toDouble()

                  val solicitud = Solicitud(
                      precio = precios.first(),
                      recogida = recogida,
                      viaje = viaje
                  )

                  val decision = DecisionEngine.decidir(solicitud, maxRecogida)

                  RegistrarLog.agregar(
                      this,
                      "Precio: $${solicitud.precio} | Recogida: ${solicitud.recogida} km | " +
                      "Viaje: ${solicitud.viaje} km | ${decision.accion}: " +
                      "${decision.motivo} | Objetivo: $${decision.monto}"
                  )
              }

              private fun extraerPrecios(elementos: List<String>): List<Int> {
                  val regex = Regex(
                      """(?i)(?:COL[$]|COP\s*[$]|[$])\s*([0-9][0-9.,]*)"""
                  )
                  return elementos.flatMap { linea ->
                      regex.findAll(linea).mapNotNull {
                          convertirNumero(it.groupValues[1])
                      }.toList()
                  }.distinct()
              }

              private fun extraerDistancias(elementos: List<String>): List<Double> {
                  val regex = Regex(
                      """(?i)([0-9]+(?:[.,][0-9]+)?)\s*km"""
                  )
                  return elementos.flatMap { linea ->
                      regex.findAll(linea).mapNotNull {
                          it.groupValues[1].replace(",", ".").toDoubleOrNull()
                      }.toList()
                  }.distinct()
              }

              private fun convertirNumero(valor: String): Int? {
                  return valor.replace(".", "").replace(",", "").toIntOrNull()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instancia = null
                  super.onDestroy()
              }
          }
          EOF

      - name: Crear pantalla principal
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/MainActivity.kt <<'EOF'
          package com.tuusuario.miapp

          import android.app.Activity
          import android.os.Bundle
          import android.content.Intent
          import android.provider.Settings
          import android.graphics.Color
          import android.graphics.Typeface
          import android.view.Gravity
          import android.widget.*
          import android.text.InputType

          class MainActivity : Activity() {

              private lateinit var estado: TextView
              private lateinit var historial: TextView
              private lateinit var interruptor: Switch
              private lateinit var maxRecogida: EditText

              private val prefs by lazy {
                  getSharedPreferences("ajustes_bot", MODE_PRIVATE)
              }

              private fun dp(v: Int): Int =
                  (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val fondo = Color.rgb(244, 246, 250)
                  val oscuro = Color.rgb(25, 29, 48)
                  val morado = Color.rgb(108, 99, 255)

                  val raiz = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(fondo)
                  }

                  val cabecera = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(24), dp(22), dp(22))
                      setBackgroundColor(oscuro)
                  }

                  cabecera.addView(TextView(this).apply {
                      text = "BOT INDRIVE"
                      textSize = 25f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                  })

                  cabecera.addView(TextView(this).apply {
                      text = "Panel de control · Modo de prueba"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                  })

                  raiz.addView(cabecera)

                  val scroll = ScrollView(this)
                  val contenido = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(24))
                  }
                  scroll.addView(contenido)
                  raiz.addView(scroll)
                  setContentView(raiz)

                  fun tarjeta(): LinearLayout {
                      val caja = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(18), dp(16), dp(18), dp(16))
                          setBackgroundColor(Color.WHITE)
                      }
                      val parametros = LinearLayout.LayoutParams(
                          -1, -2
                      ).apply {
                          bottomMargin = dp(14)
                      }
                      contenido.addView(caja, parametros)
                      return caja
                  }

                  fun titulo(caja: LinearLayout, texto: String) {
                      caja.addView(TextView(this).apply {
                          text = texto
                          textSize = 18f
                          typeface = Typeface.DEFAULT_BOLD
                          setTextColor(oscuro)
                          setPadding(0, 0, 0, dp(12))
                      })
                  }

                  val panel = tarjeta()
                  titulo(panel, "Estado del lector")

                  estado = TextView(this).apply {
                      text = "Esperando activación"
                      textSize = 15f
                      setTextColor(morado)
                  }
                  panel.addView(estado)

                  interruptor = Switch(this).apply {
                      text = "Analizar pantalla de InDrive"
                      textSize = 15f
                      isChecked = false
                      setOnCheckedChangeListener { _, checked ->
                          InDriveAccessibilityService.instancia?.activar(checked)
                          estado.text = if (checked)
                              "LECTURA ACTIVADA · SIN ACCIONES AUTOMÁTICAS"
                          else "LECTURA PAUSADA"
                      }
                  }
                  panel.addView(interruptor)

                  val ajustes = tarjeta()
                  titulo(ajustes, "Configuración")

                  ajustes.addView(TextView(this).apply {
                      text = "Distancia máxima de recogida (km)"
                      setTextColor(Color.DKGRAY)
                  })

                  maxRecogida = EditText(this).apply {
                      inputType = InputType.TYPE_CLASS_NUMBER or
                          InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setText(prefs.getFloat("max_recogida", 3f).toString())
                  }
                  ajustes.addView(maxRecogida)

                  ajustes.addView(TextView(this).apply {
                      text = "Tarifa por kilómetro: $1.200\n" +
                          "Mínimo deseado: $4.800\n" +
                          "Tarifa mínima especial: $4.000\n" +
                          "Excepción: recogida y viaje hasta 2 km\n" +
                          "Redondeo: siguiente centena"
                      textSize = 14f
                      setTextColor(Color.DKGRAY)
                      setPadding(0, dp(12), 0, dp(12))
                  })

                  ajustes.addView(Button(this).apply {
                      text = "GUARDAR CONFIGURACIÓN"
                      setOnClickListener {
                          val max = maxRecogida.text.toString()
                              .replace(",", ".").toFloatOrNull()
                          if (max == null || max <= 0) {
                              Toast.makeText(
                                  this@MainActivity,
                                  "Introduce una distancia válida",
                                  Toast.LENGTH_SHORT
                              ).show()
                          } else {
                              prefs.edit().putFloat("max_recogida", max).apply()
                              Toast.makeText(
                                  this@MainActivity,
                                  "Configuración guardada",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      }
                  })

                  ajustes.addView(Button(this).apply {
                      text = "CONFIGURAR ACCESIBILIDAD"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  val pruebas = tarjeta()
                  titulo(pruebas, "Reglas de cálculo")
                  pruebas.addView(TextView(this).apply {
                      text = "El cálculo usa únicamente los kilómetros del viaje. " +
                          "La distancia de recogida se usa para comprobar el límite. " +
                          "Las solicitudes con datos ambiguos no se procesan."
                      textSize = 14f
                      setTextColor(Color.DKGRAY)
                  })

                  val cajaHistorial = tarjeta()
                  titulo(cajaHistorial, "Registro de actividad")

                  historial = TextView(this).apply {
                      textSize = 12f
                      typeface = Typeface.MONOSPACE
                      setTextColor(Color.rgb(80, 230, 130))
                      setBackgroundColor(Color.rgb(20, 23, 29))
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                      text = "(Todavía no hay registros)"
                  }
                  cajaHistorial.addView(historial)

                  cajaHistorial.addView(Button(this).apply {
                      text = "ACTUALIZAR REGISTRO"
                      setOnClickListener { actualizarHistorial() }
                  })

                  cajaHistorial.addView(Button(this).apply {
                      text = "BORRAR REGISTRO"
                      setOnClickListener {
                          RegistrarLog.limpiar(this@MainActivity)
                          actualizarHistorial()
                      }
                  })
              }

              private fun actualizarHistorial() {
                  historial.text = RegistrarLog.obtener(this)
                      .ifBlank { "(Todavía no hay registros)" }
              }

              override fun onResume() {
                  super.onResume()
                  if (::historial.isInitialized) actualizarHistorial()
                  if (::interruptor.isInitialized) {
                      interruptor.isChecked =
                          InDriveAccessibilityService.instancia?.estaActivo() == true
                  }
              }
          }
          EOF

      - name: Crear Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Compilar APK
        run: |
          ./gradlew --no-daemon clean assembleDebug
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Bot-InDrive-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
