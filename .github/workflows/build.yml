name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Create directories
        run: |
          mkdir -p app/src/main/java/com/tuusuario/miapp
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

      - name: Create gradle.properties
        run: |
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Create build.gradle
        run: |
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          
      - name: Create settings.gradle
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "MiAppAndroid"
          include ':app'
          EOF

      - name: Create app/build.gradle
        run: |
          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.tuusuario.miapp'
              compileSdk 34
              defaultConfig { applicationId "com.tuusuario.miapp"; minSdk 26; targetSdk 34; versionCode 1; versionName "1.0" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.datastore:datastore-preferences:1.1.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <application android:allowBackup="true" android:label="Bot InDrive" android:theme="@style/Theme.Material3.DayNight.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".InDriveAccessibilityService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true" android:label="Bot InDrive">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

      - name: Create accessibility_service_config.xml
        run: |
          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="200"
              android:packageNames="sinet.startup.inDriver" />
          EOF

      - name: Create activity_main.xml
        run: |
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#F5F5F5">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp" app:cardCornerRadius="12dp" xmlns:app="http://schemas.android.com/apk/res-auto">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp" android:gravity="center">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Estado del Bot" android:textSize="18sp" android:textStyle="bold" />
                          <Switch android:id="@+id/switchMaster" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:scaleX="1.5" android:scaleY="1.5" />
                          <Button android:id="@+id/btnToggleServicio" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="16dp" android:text="Mostrar Botón Flotante" />
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>
                  <com.google.android.material.card.MaterialCardView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginBottom="16dp" app:cardCornerRadius="12dp" xmlns:app="http://schemas.android.com/apk/res-auto">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="16dp">
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Parámetros de InDrive" android:textStyle="bold" android:textSize="16sp" android:paddingBottom="8dp"/>
                          <EditText android:id="@+id/etMaxRecogida" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Max recogida (km)" android:inputType="numberDecimal" />
                          <EditText android:id="@+id/etValorKm" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Valor por km (COP)" android:inputType="number" />
                          <EditText android:id="@+id/etMinOferta" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Min oferta (COP)" android:inputType="number" />
                          <EditText android:id="@+id/etMinAceptable" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Min aceptable (COP)" android:inputType="number" />
                          <EditText android:id="@+id/etMaxViajeCorto" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Max viaje corto (km)" android:inputType="numberDecimal" />
                          <Button android:id="@+id/btnGuardar" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:text="Guardar Parámetros" android:backgroundTint="#FF9800" />
                      </LinearLayout>
                  </com.google.android.material.card.MaterialCardView>
                  <Button android:id="@+id/btnPermisoOverlay" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="1. Dar permiso flotante" />
                  <Button android:id="@+id/btnAbrirAccesibilidad" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="2. Activar Accesibilidad" />
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Registro de acciones:" android:textStyle="bold" android:paddingTop="16dp" />
                  <TextView android:id="@+id/tvLog" android:layout_width="match_parent" android:layout_height="wrap_content" android:textSize="12sp" android:fontFamily="monospace" android:background="#1E1E1E" android:textColor="#00FF00" android:padding="8dp" android:minLines="5" android:text="(sin registros)" />
              </LinearLayout>
          </ScrollView>
          EOF

      - name: Create floating_toggle.xml
        run: |
          cat << 'EOF' > app/src/main/res/layout/floating_toggle.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="#CC000000" android:padding="8dp" android:gravity="center_vertical" android:orientation="horizontal">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Auto" android:textColor="#FFFFFF" android:textStyle="bold" />
              <Switch android:id="@+id/switchBot" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp"/>
          </LinearLayout>
          EOF

      - name: Create Kotlin files
        run: |
          cat << 'EOF' > app/src/main/java/com/tuusuario/miapp/Modelos.kt
          package com.tuusuario.miapp
          data class DatosOferta(val recogidaKm: Double, val viajeKm: Double, val precioOfertado: Int)
          data class Ajustes(val maxRecogidaKm: Double, val valorPorKm: Int, val minOferta: Int, val minAceptable: Int, val maxViajeCortoKm: Double)
          data class Decision(val accion: Accion, val monto: Int, val motivo: String)
          enum class Accion { ACEPTAR, OFERTAR, IGNORAR }
          EOF

          cat << 'EOF' > app/src/main/java/com/tuusuario/miapp/RegistrarLog.kt
          package com.tuusuario.miapp
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          object RegistrarLog {
              private val entradas = mutableListOf<String>()
              fun agregar(mensaje: String) {
                  val hora = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                  synchronized(entradas) { entradas.add(0, "[$hora] $mensaje"); if(entradas.size>50) entradas.removeAt(entradas.lastIndex) }
              }
              fun obtenerTexto(): String = synchronized(entradas) { if (entradas.isEmpty()) "(sin registros)" else entradas.joinToString("\n") }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tuusuario/miapp/SettingsRepository.kt
          package com.tuusuario.miapp
          import android.content.Context
          import androidx.datastore.preferences.core.*
          import androidx.datastore.preferences.preferencesDataStore
          import kotlinx.coroutines.flow.first
          private val Context.dataStore by preferencesDataStore(name = "ajustes_bot")
          class SettingsRepository(private val context: Context) {
              companion object {
                  val MAX_RECOGIDA = doublePreferencesKey("max_recogida"); val VALOR_POR_KM = intPreferencesKey("valor_km")
                  val MIN_OFERTA = intPreferencesKey("min_oferta"); val MIN_ACEPTABLE = intPreferencesKey("min_aceptable"); val MAX_VIAJE_CORTO = doublePreferencesKey("max_viaje")
              }
              suspend fun leerAjustes(): Ajustes {
                  val p = context.dataStore.data.first()
                  return Ajustes(p[MAX_RECOGIDA] ?: 3.0, p[VALOR_POR_KM] ?: 1200, p[MIN_OFERTA] ?: 4800, p[MIN_ACEPTABLE] ?: 4000, p[MAX_VIAJE_CORTO] ?: 2.0)
              }
              suspend fun guardarAjustes(a: Ajustes) {
                  context.dataStore.edit { p -> p[MAX_RECOGIDA] = a.maxRecogidaKm; p[VALOR_POR_KM] = a.valorPorKm; p[MIN_OFERTA] = a.minOferta; p[MIN_ACEPTABLE] = a.minAceptable; p[MAX_VIAJE_CORTO] = a.maxViajeCortoKm }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tuusuario/miapp/MainActivity.kt
          package com.tuusuario.miapp
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch
          class MainActivity : AppCompatActivity() {
              private lateinit var repo: SettingsRepository
              private lateinit var switchMaster: Switch

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  repo = SettingsRepository(this)
                  val etMax = findViewById<EditText>(R.id.etMaxRecogida); val etVal = findViewById<EditText>(R.id.etValorKm)
                  val etMinO = findViewById<EditText>(R.id.etMinOferta); val etMinA = findViewById<EditText>(R.id.etMinAceptable)
                  val etCorto = findViewById<EditText>(R.id.etMaxViajeCorto)
                  switchMaster = findViewById(R.id.switchMaster)
                  
                  lifecycleScope.launch {
                      val a = repo.leerAjustes()
                      etMax.setText(a.maxRecogidaKm.toString()); etVal.setText(a.valorPorKm.toString())
                      etMinO.setText(a.minOferta.toString()); etMinA.setText(a.minAceptable.toString()); etCorto.setText(a.maxViajeCortoKm.toString())
                  }
                  
                  switchMaster.setOnCheckedChangeListener { _, isChecked -> 
                      InDriveAccessibilityService.instancia?.setBotActivo(isChecked) 
                  }
                  
                  findViewById<Button>(R.id.btnGuardar).setOnClickListener {
                      val a = Ajustes(etMax.text.toString().replace(",", ".").toDoubleOrNull() ?: 3.0, etVal.text.toString().toIntOrNull() ?: 1200, etMinO.text.toString().toIntOrNull() ?: 4800, etMinA.text.toString().toIntOrNull() ?: 4000, etCorto.text.toString().replace(",", ".").toDoubleOrNull() ?: 2.0)
                      lifecycleScope.launch { repo.guardarAjustes(a); Toast.makeText(this@MainActivity, "Guardado", Toast.LENGTH_SHORT).show() }
                  }
                  findViewById<Button>(R.id.btnPermisoOverlay).setOnClickListener { if (!Settings.canDrawOverlays(this)) startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))) }
                  findViewById<Button>(R.id.btnAbrirAccesibilidad).setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) }
                  findViewById<Button>(R.id.btnToggleServicio).setOnClickListener { InDriveAccessibilityService.instancia?.alternarVentanaFlotante() ?: Toast.makeText(this, "Activa la accesibilidad primero", Toast.LENGTH_SHORT).show() }
              }
              
              override fun onResume() { 
                  super.onResume(); 
                  findViewById<TextView>(R.id.tvLog)?.text = RegistrarLog.obtenerTexto() 
                  
                  val estaActivo = InDriveAccessibilityService.instancia?.isBotActivo() ?: false
                  if (switchMaster.isChecked != estaActivo) {
                      switchMaster.setOnCheckedChangeListener(null)
                      switchMaster.isChecked = estaActivo
                      switchMaster.setOnCheckedChangeListener { _, isChecked -> InDriveAccessibilityService.instancia?.setBotActivo(isChecked) }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/tuusuario/miapp/InDriveAccessibilityService.kt
          package com.tuusuario.miapp
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.LayoutInflater
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.widget.Switch
          import kotlinx.coroutines.*
          import kotlin.math.roundToInt
          class InDriveAccessibilityService : AccessibilityService() {
              companion object {
                  @Volatile var instancia: InDriveAccessibilityService? = null; private set
                  @Volatile var botActivoGlobal = false
              }
              private val scope = CoroutineScope(Dispatchers.Main + SupervisorJob())
              private lateinit var repo: SettingsRepository
              private var ventana: android.view.View? = null
              private var ultimoProcesamiento = 0L
              private var actualizandoSwitch = false

              override fun onServiceConnected() { super.onServiceConnected(); instancia = this; repo = SettingsRepository(applicationContext) }
              
              fun isBotActivo() = botActivoGlobal
              fun setBotActivo(activo: Boolean) { 
                  if (botActivoGlobal == activo) return
                  botActivoGlobal = activo
                  actualizandoSwitch = true
                  ventana?.findViewById<Switch>(R.id.switchBot)?.isChecked = activo
                  actualizandoSwitch = false
                  RegistrarLog.agregar(if(activo) "BOT ENCENDIDO" else "BOT APAGADO") 
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event?.packageName?.toString() != "sinet.startup.inDriver" || !botActivoGlobal) return
                  if (System.currentTimeMillis() - ultimoProcesamiento < 500) return 

                  val root = rootInActiveWindow ?: return
                  
                  val btnAceptar = buscarBoton(root, listOf("Aceptar por"))
                  val btnOfertar = buscarBoton(root, listOf("Ofrece tu tarifa", "Ofertar"))
                  
                  if (btnAceptar == null && btnOfertar == null) return 

                  val textos = mutableListOf<String>()
                  fun rec(n: AccessibilityNodeInfo) { 
                      n.text?.toString()?.let { if(it.isNotBlank()) textos.add(it) }
                      for (i in 0 until n.childCount) n.getChild(i)?.let { rec(it) } 
                  }
                  rec(root)
                  
                  procesarOferta(root, textos, btnAceptar, btnOfertar)
              }

              private fun procesarOferta(root: AccessibilityNodeInfo, textos: List<String>, btnAceptar: AccessibilityNodeInfo?, btnOfertar: AccessibilityNodeInfo?) {
                  ultimoProcesamiento = System.currentTimeMillis()
                  
                  var precio: Int? = null
                  // Intentar leer el precio directamente del botón verde
                  btnAceptar?.text?.toString()?.let {
                      val match = Regex("""(?:COL\$|COP|\$)\s*([\d.,]+)""").find(it)
                      if (match != null) precio = match.groupValues[1].replace(".", "").replace(",", "").toIntOrNull()
                  }
                  
                  // Si falla, buscar en los textos
                  if (precio == null) {
                      for (txt in textos) {
                          val match = Regex("""(?:COL\$|COP|\$)\s*([\d.,]+)""").find(txt)
                          if (match != null) {
                              precio = match.groupValues[1].replace(".", "").replace(",", "").toIntOrNull()
                              if (precio != null) break
                          }
                      }
                  }

                  val distancias = mutableListOf<Double>()
                  val regexDistancia = Regex("""([\d]+(?:[.,]\d+)?)\s*(?:km|m|metros|mts)\b""", RegexOption.IGNORE_CASE)
                  for (txt in textos) {
                      val match = regexDistancia.find(txt)
                      if (match != null) {
                          val valor = match.groupValues[1].replace(",", ".").toDoubleOrNull()
                          if (valor != null && valor >= 0.0 && valor < 200.0) {
                              val unidad = match.groupValues[2].lowercase()
                              if ((unidad == "m" || unidad == "metros" || unidad == "mts") && valor > 50) {
                                  distancias.add(valor / 1000.0)
                              } else {
                                  distancias.add(valor)
                              }
                          }
                      }
                  }

                  var recogidaKm = 0.0
                  var viajeKm = 0.0
                  
                  if (distancias.size >= 2) {
                      recogidaKm = distancias[0]
                      viajeKm = distancias[1]
                  } else if (distancias.size == 1) {
                      // Si solo hay una distancia, es el viaje. Asumimos recogida en 0.1 km
                      recogidaKm = 0.1
                      viajeKm = distancias[0]
                  }

                  if (precio != null && viajeKm > 0.0) {
                      RegistrarLog.agregar("Oferta: $precio | Rec: $recogidaKm km | Viaje: $viajeKm km")

                      scope.launch {
                          val a = repo.leerAjustes()
                          delay((1000..2000).random().toLong())

                          if (recogidaKm > a.maxRecogidaKm) {
                              RegistrarLog.agregar("IGNORAR: Recogida lejos")
                              return@launch
                          }

                          if (viajeKm <= a.maxViajeCortoKm && precio >= a.minAceptable) {
                              RegistrarLog.agregar("ACEPTAR: $precio")
                              btnAceptar?.let { tocar(it) }
                          } else {
                              val monto = (maxOf(viajeKm * a.valorPorKm, a.minOferta.toDouble()) / 100.0).roundToInt() * 100
                              RegistrarLog.agregar("OFERTAR: $monto")
                              if (btnOfertar != null) {
                                  tocar(btnOfertar)
                                  delay(800)
                                  val root2 = rootInActiveWindow
                                  if (root2 != null) {
                                      val input = buscarEditText(root2)
                                      if (input != null) {
                                          val args = android.os.Bundle()
                                          args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, monto.toString())
                                          input.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                                          delay(400)
                                          buscarBoton(root2, listOf("Enviar"))?.let { tocar(it) }
                                      }
                                  }
                              }
                          }
                      }
                  } else {
                      RegistrarLog.agregar("Fallo -> Precio: $precio, Kms: $distancias")
                      RegistrarLog.agregar("Textos: ${textos.take(5)}...")
                  }
              }

              override fun onInterrupt() = Unit
              override fun onDestroy() { instancia = null; scope.cancel(); ocultarVentanaFlotante(); super.onDestroy() }
              
              fun alternarVentanaFlotante() { if (ventana != null) ocultarVentanaFlotante() else mostrarVentanaFlotante() }
              
              private fun mostrarVentanaFlotante() {
                  val wm = getSystemService(WINDOW_SERVICE) as WindowManager; val v = (getSystemService(LAYOUT_INFLATER_SERVICE) as LayoutInflater).inflate(R.layout.floating_toggle, null)
                  val params = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, android.graphics.PixelFormat.TRANSLUCENT)
                  
                  // Arriba a la derecha
                  params.gravity = android.view.Gravity.TOP or android.view.Gravity.END
                  params.x = 20
                  params.y = 150 
                  
                  val sw = v.findViewById<Switch>(R.id.switchBot)
                  sw.isChecked = botActivoGlobal
                  sw.setOnCheckedChangeListener { _, c -> 
                      if (!actualizandoSwitch) setBotActivo(c) 
                  }
                  wm.addView(v, params); ventana = v
              }
              private fun ocultarVentanaFlotante() { ventana?.let { (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it) }; ventana = null }
              
              private fun buscarBoton(n: AccessibilityNodeInfo, claves: List<String>): AccessibilityNodeInfo? {
                  val t = n.text?.toString() ?: ""
                  val d = n.contentDescription?.toString() ?: ""
                  for (k in claves) { if (t.contains(k, true) || d.contains(k, true)) return n }
                  for (i in 0 until n.childCount) buscarBoton(n.getChild(i) ?: continue, claves)?.let { return it }
                  return null
              }
              private fun buscarEditText(n: AccessibilityNodeInfo): AccessibilityNodeInfo? {
                  if (n.isEditable) return n
                  for (i in 0 until n.childCount) buscarEditText(n.getChild(i) ?: continue)?.let { return it }; return null
              }
              private fun tocar(nodo: AccessibilityNodeInfo) {
                  val r = Rect(); nodo.getBoundsInScreen(r); val p = Path().apply { moveTo(r.centerX().toFloat(), r.centerY().toFloat()); lineTo(r.centerX()+2f, r.centerY()+2f) }
                  dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 100)).build(), null, null)
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
