name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # 1. Descomprimir el ZIP que subiste
      - name: Unzip project
        run: |
          if [ -f MiAppAndroid.zip ]; then
            unzip MiAppAndroid.zip -d .
          fi

      # 2. Forzar Gradle moderno
      - name: Fix Gradle wrapper
        run: |
          mkdir -p MiAppAndroid/gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > MiAppAndroid/gradle/wrapper/gradle-wrapper.properties

      # 3. Sobrescribir archivos de configuración raíz
      - name: Overwrite root build.gradle
        run: |
          cat << 'EOF' > MiAppAndroid/build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF
          cat << 'EOF' > MiAppAndroid/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MiAppAndroid"
          include ':app'
          EOF

      # 4. Sobrescribir el build.gradle de la app
      - name: Overwrite app build.gradle
        run: |
          cat << 'EOF' > MiAppAndroid/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tuusuario.miapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.tuusuario.miapp"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'androidx.datastore:datastore-preferences:1.1.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
          }
          EOF

      # 5. Quitar el paquete viejo del Manifest (Gradle moderno ya no lo permite ahí)
      - name: Fix AndroidManifest
        run: |
          sed -i 's/package="com.tuusuario.miapp"//g' MiAppAndroid/app/src/main/AndroidManifest.xml

      # 6. Compilar
      - name: Build APK
        run: |
          cd MiAppAndroid
          chmod +x gradlew
          ./gradlew assembleDebug
          
      # 7. Entregar el APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: MiAppAndroid/app/build/outputs/apk/debug/app-debug.apk
