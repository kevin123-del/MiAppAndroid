name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Crear estructura
        run: |
          mkdir -p app/src/main/java/com/tuusuario/miapp
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/values

      - name: Crear gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Crear configuración Gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BotInDrive"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.tuusuario.miapp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.tuusuario.miapp'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
          }
          EOF

      - name: Crear Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <application
                  android:allowBackup="true"
                  android:label="Bot InDrive"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".InDriveAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true"
                      android:label="Analizador InDrive">

                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>

                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>

              </application>
          </manifest>
          EOF

      - name: Crear tema
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#FF9800</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:navigationBarColor">#FFFFFF</item>
              </style>
          </resources>
          EOF

      - name: Configurar accesibilidad
        run: |
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="false"
              android:notificationTimeout="300"
              android:packageNames="sinet.startup.inDriver"/>
          EOF

      - name: Crear modelos y motor de decisiones
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/Modelos.kt <<'EOF'
          package com.tuusuario.miapp

          data class Ajustes(
              val maxRecogida: Double = 3.0,
              val valorKm: Int = 1200,
              val minimoOferta: Int = 4800,
              val minimoIndrive: Int = 4000,
              val maxRecogidaMinima: Double = 2.0,
              val maxViajeMinimo: Double = 2.0,
              val maxViajeCorto: Double = 2.0
          )

          data class Solicitud(
              val precio: Int,
              val recogidaKm: Double,
              val viajeKm: Double,
              val identificador: String
          )

          enum class Accion {
              ACEPTAR, CONTRAOFERTAR, DESCARTAR, DATOS_INCOMPLETOS
          }

          data class Decision(
              val accion: Accion,
              val monto: Int,
              val motivo: String,
              val puntuacion: Double = 0.0
          )
          EOF

          cat > app/src/main/java/com/tuusuario/miapp/DecisionEngine.kt <<'EOF'
          package com.tuusuario.miapp

          import kotlin.math.ceil

          object DecisionEngine {

              fun redondearCentena(valor: Double): Int {
                  return (ceil(valor / 100.0) * 100).toInt()
              }

              fun decidir(
                  s: Solicitud,
                  a: Ajustes
              ): Decision {

                  if (
                      s.precio <= 0 ||
                      s.recogidaKm < 0 ||
                      s.viajeKm <= 0
                  ) {
                      return Decision(
                          Accion.DATOS_INCOMPLETOS,
                          0,
                          "Datos inválidos"
                      )
                  }

                  if (s.recogidaKm > a.maxRecogida) {
                      return Decision(
                          Accion.DESCARTAR,
                          0,
                          "Recogida supera el máximo permitido"
                      )
                  }

                  val carreraMinima =
                      s.recogidaKm <= a.maxRecogidaMinima &&
                      s.viajeKm <= a.maxViajeMinimo

                  if (
                      carreraMinima &&
                      s.precio >= a.minimoIndrive
                  ) {
                      return Decision(
                          Accion.ACEPTAR,
                          s.precio,
                          "Tarifa mínima: recogida y viaje de máximo 2 km"
                      )
                  }

                  val calculado =
                      s.viajeKm * a.valorKm

                  val objetivo = maxOf(
                      calculado,
                      a.minimoOferta.toDouble()
                  )

                  val monto = redondearCentena(objetivo)

                  if (s.precio >= monto) {
                      return Decision(
                          Accion.ACEPTAR,
                          s.precio,
                          "El pasajero ofrece el valor objetivo o más"
                      )
                  }

                  return Decision(
                      Accion.CONTRAOFERTAR,
                      monto,
                      "Oferta inferior al valor calculado"
                  )
              }

              fun rentabilidad(s: Solicitud): Double {
                  val kmTotal = s.recogidaKm + s.viajeKm
                  return if (kmTotal > 0) {
                      s.precio.toDouble() / kmTotal
                  } else {
                      0.0
                  }
              }
          }
          EOF

      - name: Crear registro
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/RegistrarLog.kt <<'EOF'
          package com.tuusuario.miapp

          import android.content.Context
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          object RegistrarLog {

              private const val PREFS = "historial_bot"
              private const val KEY = "entradas"

              fun agregar(context: Context, mensaje: String) {
                  val prefs = context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  val hora = SimpleDateFormat(
                      "HH:mm:ss",
                      Locale.getDefault()
                  ).format(Date())

                  val anterior = prefs.getString(KEY, "") ?: ""
                  val nuevo = "[$hora] $mensaje\n$anterior"

                  prefs.edit().putString(
                      KEY,
                      nuevo.lines().take(60).joinToString("\n")
                  ).apply()
              }

              fun obtener(context: Context): String {
                  return context.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                      .getString(KEY, "") ?: ""
              }
          }
          EOF

      - name: Crear servicio de accesibilidad
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/InDriveAccessibilityService.kt <<'EOF'
          package com.tuusuario.miapp

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import android.content.Context
          import java.util.regex.Pattern

          class InDriveAccessibilityService : AccessibilityService() {

              companion object {
                  var instancia: InDriveAccessibilityService? = null
              }

              private var activo = false
              private var ultimoContenido = ""
              private var ultimoAnalisis = 0L

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instancia = this
                  RegistrarLog.agregar(this, "Servicio de accesibilidad conectado")
              }

              fun activar(valor: Boolean) {
                  activo = valor
                  RegistrarLog.agregar(
                      this,
                      if (valor) "Análisis activado" else "Análisis pausado"
                  )
              }

              fun estaActivo(): Boolean = activo

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (!activo || event == null) return

                  if (event.packageName?.toString() != "sinet.startup.inDriver") return

                  val ahora = System.currentTimeMillis()
                  if (ahora - ultimoAnalisis < 900) return
                  ultimoAnalisis = ahora

                  val root = rootInActiveWindow ?: return

                  try {
                      val textos = mutableListOf<String>()
                      recolectar(root, textos)

                      val contenido = textos.joinToString(" | ")

                      if (contenido == ultimoContenido) return
                      ultimoContenido = contenido

                      analizarPantalla(textos)

                  } catch (e: Exception) {
                      RegistrarLog.agregar(this, "Error de lectura: ${e.message}")
                  } finally {
                      root.recycle()
                  }
              }

              private fun recolectar(
                  nodo: AccessibilityNodeInfo,
                  lista: MutableList<String>
              ) {
                  nodo.text?.toString()?.trim()?.takeIf { it.isNotEmpty() }?.let {
                      lista.add(it)
                  }

                  nodo.contentDescription?.toString()?.trim()
                      ?.takeIf { it.isNotEmpty() }?.let {
                          lista.add(it)
                      }

                  for (i in 0 until nodo.childCount) {
                      val hijo = nodo.getChild(i) ?: continue
                      try {
                          recolectar(hijo, lista)
                      } finally {
                          hijo.recycle()
                      }
                  }
              }

              private fun analizarPantalla(textos: List<String>) {
                  val texto = textos.joinToString("\n")

                  val precios = extraerPrecios(texto)

                  val recogida = extraerDistanciaEtiquetada(
                      texto,
                      listOf("recogida", "recoger", "pickup")
                  )

                  val viaje = extraerDistanciaEtiquetada(
                      texto,
                      listOf("viaje", "recorrido", "destino", "trayecto")
                  )

                  RegistrarLog.agregar(
                      this,
                      "Pantalla detectada. Precios: ${precios.joinToString()}. " +
                      "Recogida: ${recogida ?: "NO IDENTIFICADA"} km. " +
                      "Viaje: ${viaje ?: "NO IDENTIFICADO"} km."
                  )

                  // No se adivinan distancias ni se realizan toques.
                  if (precios.size != 1 || recogida == null || viaje == null) {
                      RegistrarLog.agregar(
                          this,
                          "Solicitud sin procesar: datos ambiguos o incompletos."
                      )
                      return
                  }

                  val prefs = getSharedPreferences("ajustes_bot", Context.MODE_PRIVATE)

                  val ajustes = Ajustes(
                      maxRecogida = prefs.getFloat("max_recogida", 3f).toDouble(),
                      valorKm = prefs.getInt("valor_km", 1200),
                      minimoOferta = prefs.getInt("min_oferta", 4800),
                      minimoIndrive = 4000,
                      maxRecogidaMinima = 2.0,
                      maxViajeMinimo = 2.0
                  )

                  val solicitud = Solicitud(
                      precios[0],
                      recogida,
                      viaje,
                      texto.hashCode().toString()
                  )

                  val decision = DecisionEngine.decidir(solicitud, ajustes)

                  RegistrarLog.agregar(
                      this,
                      "${decision.accion}: ${decision.motivo}. " +
                      "Monto: $${decision.monto}"
                  )
              }

              private fun extraerPrecios(texto: String): List<Int> {
                  val regex = Regex(
                      """(?i)(?:COL\\$|COP\\s*\\$|\\$)\\s*([0-9][0-9.,]*)"""
                  )

                  return regex.findAll(texto).mapNotNull {
                      convertirNumero(it.groupValues[1])
                  }.toList().distinct()
              }

              private fun extraerDistanciaEtiquetada(
                  texto: String,
                  etiquetas: List<String>
              ): Double? {
                  for (etiqueta in etiquetas) {
                      val regex = Regex(
                          """(?i)${Regex.escape(etiqueta)}[^\\n]{0,60}?([0-9]+(?:[.,][0-9]+)?)\\s*km"""
                      )

                      val resultado = regex.find(texto)
                      if (resultado != null) {
                          return resultado.groupValues[1]
                              .replace(",", ".").toDoubleOrNull()
                      }
                  }
                  return null
              }

              private fun convertirNumero(valor: String): Int? {
                  val limpio = valor.replace(".", "").replace(",", "")
                  return limpio.toIntOrNull()
              }

              override fun onInterrupt() {}

              override fun onDestroy() {
                  instancia = null
                  super.onDestroy()
              }
          }
          EOF

      - name: Crear pantalla principal
        run: |
          cat > app/src/main/java/com/tuusuario/miapp/MainActivity.kt <<'EOF'
