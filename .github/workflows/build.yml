                  fun titulo(texto: String) {
                      layout.addView(TextView(this).apply {
                          text = texto
                          textSize = 19f
                          setTextColor(Color.BLACK)
                          setPadding(0, 18, 0, 8)
                      })
                  }

                  fun campo(nombre: String, valor: String, decimal: Boolean = false): EditText {
                      layout.addView(TextView(this).apply {
                          text = nombre
                          textSize = 14f
                          setTextColor(Color.DKGRAY)
                      })

                      return EditText(this).apply {
     
